import org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        // Make sure this version matches the one included in Kotlin for Forge
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
        // OPTIONAL Gradle plugin for Kotlin Serialization
        classpath 'org.jetbrains.kotlin:kotlin-serialization:1.9.22'
    }
}

plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.137'

    id "org.jetbrains.kotlin.jvm" version "$kotlin_version"

    id 'com.matthewprenger.cursegradle' version '1.4.0'
    id "com.modrinth.minotaur" version "2.4.5"
    id "com.github.johnrengelman.shadow" version "7.1.2"

    id "maven-publish"
}

java {
    withSourcesJar()
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

kotlin.target.compilations.getByName('gameTest').associateWith(kotlin.target.compilations.getByName('main'))

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    // Validate AT files and raise errors when they have invalid targets
    // This option is false by default, but turning it on is recommended
    validateAccessTransformers = true

    runs {
        client {
            client()
        }
        auditClient {
            client()
            gameDirectory = file('run-audit-client')
        }
        data {
            data()
        }
        server {
            server()
        }
        auditServer {
            server()
            gameDirectory = file('run-audit')
            systemProperty 'forge.enableGameTest', 'true'
            systemProperty 'forge.gameTestServer', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'skyriders'
            programArgument '--nogui'
        }
    }

    mods {
        // Should this be vs_addon_template instead of testproject? I'm not sure
        skyriders {
            sourceSet sourceSets.main
            if (project.hasProperty('gameTests')) sourceSet sourceSets.gameTest
        }
    }
}

var mixinId = "skyriders"

mixin {
    add sourceSets.main, "mixins.${mixinId}.refmap.json"

    config "${mixinId}.mixins.json"
}


// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
configurations {
    nativePhysicsTest
    productionMods { transitive = false }
}
sourceSets.test.compileClasspath = configurations.nativePhysicsTest + sourceSets.test.compileClasspath + sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath = configurations.nativePhysicsTest + sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath

repositories {
    //Add any repositories to fetch dependencies from here.
    //Most dependencies are mirrored to the VS Maven, so by default only it is included alongside KFF.
    maven {
        name = "Valkyrien Skies Internal"
        url = project.vs_maven_url ?: 'https://maven.valkyrienskies.org'
        if (project.vs_maven_username && project.vs_maven_password) {
            credentials {
                username = project.vs_maven_username
                password = project.vs_maven_password
            }
        }
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    //Framework
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
    }
}


dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.joml:joml-primitives:1.10.0'
    nativePhysicsTest "org.valkyrienskies:physics_api_krunch:${krunch_version}"
    productionMods "org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}"
    productionMods "thedarkcolour:kotlinforforge:${kotlin_forge}:all"
    productionMods "curse.maven:framework-549225:${framework_file}"
    // region mixins
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    // endregion

    // region Valkyrien Skies
    implementation("org.valkyrienskies.core:api:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:internal:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:util:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    implementation("org.valkyrienskies.core:impl:${vs_core_version}") { transitive = false
        exclude group: 'org.joml', module: ''
    }
    modApi("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}") { transitive = false
        exclude group: 'org.valkyrienskies.core', module: ''
    }
    // endregion

    // region VS deps
    implementation "com.fasterxml.jackson.core:jackson-annotations:2.13.3"
    compileOnly("org.joml:joml:1.10.4")
    compileOnly("org.joml:joml-primitives:1.10.0")
    implementation "thedarkcolour:kotlinforforge:${kotlin_forge}"
    modImplementation "curse.maven:framework-549225:${framework_file}"
    // endregion

    // Create
    //modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    //modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    //modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    //modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    //modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // JEI
    //modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    //modImplementation("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"

    options.release = 17
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    maxParallelForks = 1
}

tasks.register('exportServerRuntime', Sync) {
    from(configurations.productionMods)
    into(layout.buildDirectory.dir('server-runtime/mods'))
    doLast {
        layout.buildDirectory.file('server-runtime/server.properties').get().asFile.text =
            "MC_VERSION=${minecraft_version}\nFORGE_VERSION=${forge_version}\n"
    }
}

tasks.register('prepareAuditServer') {
    doLast {
        file('run-audit').mkdirs()
        def eula = file('run-audit/eula.txt')
        if (!eula.exists()) eula.text = 'eula=true\n'
    }
}

tasks.named('runAuditServer') { dependsOn 'prepareAuditServer' }

tasks.withType(KotlinJvmCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += "-Xjvm-default=all"

    }
}

jar {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": mod_version,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs": "${mixinId}.mixins.json", // TODO: figure out why the MixinConfigs field did not add automatically
        ])
    }
}

configurations {
    shade
    implementation.extendsFrom shade
}

processResources {
    var replaceProperties = [
            mod_id          : mod_id,
            mod_name        : mod_name,
            mod_license     : mod_license,
            mod_version     : mod_version,
            mod_authors     : mod_authors,
            mod_description : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    // Minecraft 1.18 (1.18-pre2) upwards uses Java 17.
    it.options.release = 17
}

publishing {
    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        if (project.vs_maven_username && project.vs_maven_password) {
            println "Publishing to VS Maven ($version)"
            maven {
                name = "VSMaven"
                url = project.vs_maven_url
                credentials {
                    username = project.vs_maven_username
                    password = project.vs_maven_password
                }
            }
        }
//        if (System.getenv("GITHUB_ACTOR") != null) {
//            println "Publishing to Github Packages"
//            maven {
//                name = "GitHubPackages"
//                url = uri("https://maven.pkg.github.com/ValkyrienSkies/Clockwork")
//                credentials {
//                    username = System.getenv("GITHUB_ACTOR")
//                    password = System.getenv("GITHUB_TOKEN")
//                }
//            }
//        }
    }
}
