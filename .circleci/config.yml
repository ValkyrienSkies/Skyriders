# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/2.0/configuration-reference
version: 2.1

orbs:
  discord: antonioned/discord@0.1.0

executors:
  java_large:
    resource_class: large
    docker:
      - image: cimg/openjdk:21.0
    environment:
      ORG_GRADLE_PROJECT_block_external_repositories: "true"

commands:
  install_jdk17:
    steps:
      - run:
          name: Install Java 17 toolchain
          command: |
            set -euo pipefail
            JDK17_DIR="${HOME}/.jdks/temurin-17"
            JDK17_ARCHIVE="/tmp/temurin-17.tar.gz"
            JDK17_URL="https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse?project=jdk"
            if [ -n "${JAVA_HOME:-}" ]; then
              JDK21_DIR="${JAVA_HOME}"
            else
              JAVA_BIN="$(readlink -f "$(command -v java)")"
              JDK21_DIR="$(dirname "$(dirname "${JAVA_BIN}")")"
            fi

            if [ ! -x "${JDK17_DIR}/bin/java" ]; then
              rm -rf "${JDK17_DIR}" "${JDK17_ARCHIVE}"
              mkdir -p "${JDK17_DIR}"
              curl --fail --location --retry 3 --output "${JDK17_ARCHIVE}" "${JDK17_URL}"
              tar -xzf "${JDK17_ARCHIVE}" --strip-components=1 -C "${JDK17_DIR}"
            fi

            "${JDK17_DIR}/bin/java" -version

            mkdir -p "${HOME}/.gradle"
            if [ -f "${HOME}/.gradle/gradle.properties" ]; then
              sed -i '/^org.gradle.java.installations.paths=/d;/^org.gradle.java.installations.auto-detect=/d' "${HOME}/.gradle/gradle.properties"
            fi
            {
              echo "org.gradle.java.installations.paths=${JDK17_DIR},${JDK21_DIR}"
              echo "org.gradle.java.installations.auto-detect=true"
            } >> "${HOME}/.gradle/gradle.properties"

            echo "export JDK17_HOME='${JDK17_DIR}'" >> "${BASH_ENV}"

  checkout_and_cache:
    steps:
      - checkout
      - run:
          name: Ensure Gradle wrapper is executable
          command: chmod +x gradlew
      - run: git submodule sync
      - run: git submodule update --init

      - restore_cache:
          keys:
            - v1-gradle-home-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}
            - v1-gradle-home
      - restore_cache:
          keys:
            - v1-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}
      - install_jdk17

  save_artifacts:
    parameters:
      artifact_name:
        type: string
        default: skyriders
      version:
        type: string
        default: ${CIRCLE_SHA1}
    steps:
      # Rename artifacts to "forge.jar" and "fabric.jar"
      - run: mkdir -p artifacts
      - run: |
          set -euo pipefail
          find ./build/libs \
            -name "<< parameters.artifact_name >>*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-shadow.jar" \
            ! -name "*-javadoc.jar" \
            -exec bash -c 'cp "$0" "./artifacts/<< parameters.artifact_name >>-forge-<< parameters.version >>.jar"' {} \;
      - store_artifacts:
          path: artifacts
      # Make artifacts available to downstream jobs
      - persist_to_workspace:
          root: .
          paths:
            - artifacts

  save_artifacts_and_generate_discord:
    parameters:
      artifact_name:
        type: string
        default: skyriders
      version:
        type: string
        default: ${CIRCLE_SHA1}
    steps:
      - save_artifacts:
          artifact_name: << parameters.artifact_name >>
          version: << parameters.version >>
      - run: >-
          echo 'export DISCORD_MSG="
          New version, **${CIRCLE_TAG}** |
          [Download Forge](https://output.circle-artifacts.com/output/job/${CIRCLE_WORKFLOW_JOB_ID}/artifacts/${CIRCLE_NODE_INDEX}/artifacts/<< parameters.artifact_name >>-forge-<< parameters.version >>.jar)
          "' >> "$BASH_ENV"

  save_gradle_cache:
    steps:
      - save_cache:
          key: v1-gradle-home-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}
          paths:
            - ~/.gradle
      - save_cache:
          key: v1-gradle-{{ checksum "build.gradle" }}-{{ checksum "gradle.properties" }}
          paths:
            - .gradle

  prepare_server_dir:
    parameters:
      server_root:
        type: string
    steps:
      - run:
          name: Prepare clean server directory
          command: |
            set -euo pipefail
            rm -rf "<< parameters.server_root >>"
            mkdir -p "<< parameters.server_root >>/mods"
            mkdir -p "<< parameters.server_root >>/config"

  run_test_server:
    parameters:
      cmd:
        type: string
      workdir:
        type: string
    steps:
      - run:
          name: Run dedicated production server
          command: |
            set -euo pipefail
            cd "<< parameters.workdir >>"
            
            # Accept eula automatically
            echo "eula=true" > eula.txt || true
            
            # Pipe "stop" into servers stdin so it closes right after a successful launch
            # Timeout 5 mins just in case, but we should either stop after launch, or error and move on
            timeout 5m echo "stop" | << parameters.cmd >> || true
            
            # Most reliable way I could find to detect a crash or not
            if grep -q "For help, type \"help\"" logs/latest.log; then
              echo "Server loaded successfully!"
              exit 0
            else
              echo "Server failed to start!"
              exit 1
            fi
      - store_artifacts:
          path: << parameters.workdir >>/logs
          when: always
      - store_artifacts:
          path: << parameters.workdir >>/latest.log
          when: always

jobs:
  gradle_build:
    executor: java_large
    steps:
      - checkout_and_cache
      - run:
          name: Build
          command: "./gradlew build --no-daemon --stacktrace"
      - save_artifacts
      - save_gradle_cache

  forge_server_test:
    executor: java_large
    environment:
      MC_VERSION: "1.20.1"
      FORGE_VERSION: "47.2.0"
      KFF_URL: "https://cdn.modrinth.com/data/ordsPcFz/versions/hmeyC41q/kotlinforforge-4.11.0-all.jar"
      VS2_URL: "https://maven.valkyrienskies.org/org/valkyrienskies/valkyrienskies-120-forge/2.4.13+c805b0b2ab/valkyrienskies-120-forge-2.4.13+c805b0b2ab.jar"
    steps:
      - attach_workspace:
          at: .
      - install_jdk17
      - run:
          name: Use Java 17 for Forge server test
          command: |
            echo 'export JAVA_HOME=$JDK17_HOME' >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"
      - prepare_server_dir:
          server_root: /tmp/forge-server
      - run:
          name: Find built Forge mod jar
          command: |
            set -euo pipefail
            FORGE_JAR="$(pwd)/$(ls -1 artifacts/*-forge-*.jar | head -n1)"
            if [ -z "${FORGE_JAR}" ]; then
              echo "No Forge jar found in artifacts/"
              ls -la artifacts || true
              exit 1
            fi
            echo "export FORGE_MOD_JAR=${FORGE_JAR}" >> "$BASH_ENV"
      - run:
          name: Download Forge server
          command: |
            set -euo pipefail
            cd /tmp/forge-server
            curl -L "https://maven.minecraftforge.net/net/minecraftforge/forge/${MC_VERSION}-${FORGE_VERSION}/forge-${MC_VERSION}-${FORGE_VERSION}-installer.jar" -o forge-installer-${FORGE_VERSION}.jar
      - run:
          name: Install Forge server
          command: |
            set -euo pipefail
            cd /tmp/forge-server
            java -jar forge-installer-${FORGE_VERSION}.jar --installServer
            # Copy the mod into mods/
            cp "${FORGE_MOD_JAR}" mods/
      - run:
          name: Download Kotlin For Forge
          command: |
            set -euo pipefail
            cd /tmp/forge-server
            curl -L "${KFF_URL}" -o mods/kff.jar
      - run:
          name: Download Valkyrien Skies 2
          command: |
            set -euo pipefail
            cd /tmp/forge-server
            curl -L "${VS2_URL}" -o mods/vs2.jar
      - run_test_server:
          cmd: "./run.sh nogui"
          workdir: "/tmp/forge-server"

  publish_to_maven:
    executor: java_large
    steps:
      - checkout_and_cache
      - run:
          name: Build
          command: "./gradlew build publish --no-daemon --stacktrace"

  deploy_to_curse:
    executor: java_large
    steps:
      - checkout_and_cache
      - run: echo 'export ORG_GRADLE_PROJECT_CustomReleaseVersion=${CIRCLE_TAG}' >> "$BASH_ENV"
      - run:
          command: "./gradlew build modrinth curseforge publish --no-daemon --stacktrace --continue"

  notify_playtesters:
    executor: java_large
    steps:
      - checkout_and_cache
      - run:
          name: Build
          command: "./gradlew build --no-daemon --stacktrace"
      - save_artifacts_and_generate_discord
      - discord/status:
          success_message: ${DISCORD_MSG}
          success_only: true
          webhook: ${SKYRIDERS_120_WEBHOOK}

  deploy_to_lilypad:
    executor: java_large
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Find built Forge mod jar
          command: |
            set -euo pipefail
            FORGE_JAR="$(pwd)/$(ls -1 artifacts/*-forge-*.jar | head -n1)"
            if [ -z "${FORGE_JAR}" ]; then
              echo "No Forge jar found in artifacts/"
              ls -la artifacts || true
              exit 1
            fi
            
            PLAYTEST_JAR="$(pwd)/hz-playtest.jar"
            cp "${FORGE_JAR}" "${PLAYTEST_JAR}"

            echo "Prepared playtest jar: ${PLAYTEST_JAR}"
            echo "export FORGE_MOD_JAR='${PLAYTEST_JAR}'" >> "$BASH_ENV"
      - run:
          name: Install SSH tools
          command: sudo apt-get update && sudo apt-get install -y openssh-client
      - run:
          name: Upload jar to Lilypad mods folder
          command: |
            mkdir -p ~/.ssh
            echo "${LILYPAD_SFTP_PRIVATE_KEY}" | base64 -d > ~/.ssh/lilypad_key
            chmod 600 ~/.ssh/lilypad_key

            sftp \
              -i ~/.ssh/lilypad_key \
              -o StrictHostKeyChecking=no \
              -P "${LILYPAD_SFTP_PORT}" \
              "${LILYPAD_SFTP_USER}@${LILYPAD_SFTP_HOST}" \<<EOF
            cd mods
            put "${FORGE_MOD_JAR}"
            bye
            EOF
      - run:
          name: Restart Lilypad server
          command: |
            curl --fail-with-body -X POST "https://panel.lilypad.gg/api/client/servers/${LILYPAD_SERVER_ID}/power" \
              -H "Authorization: Bearer ${LILYPAD_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d '{"signal":"restart"}'

workflows:
  build:
    jobs:
      - gradle_build:
          context:
            - valkyrien_maven

      - forge_server_test:
          requires:
            - gradle_build
          context:
            - valkyrien_maven

      - notify_playtesters:
          filters:
            tags:
              only: /^playtest.*/
            branches:
              ignore: /.*/
          context:
            - discord_webhooks
            - valkyrien_maven

      - deploy_to_curse:
          filters:
            tags:
              only: /^release.*/
            branches:
              ignore: /.*/
          context:
            - curse_publishing
            - valkyrien_maven

      - publish_to_maven:
          filters:
            branches:
              only:
                - /.*\/main/
                - /.*\/playtest/
          context:
            - valkyrien_maven
            - github_maven

      - deploy_to_lilypad:
          requires:
            - notify_playtesters
          filters:
            tags:
              only: /^playtest\/1\.20\.1\/.*/
            branches:
              ignore: /.*/
          context:
            - valkyrien_maven
            - lilypad_publishing
